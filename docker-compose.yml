version: '3.8'

services:
  dozzle:
    image: amir20/dozzle:v6.4.2
    container_name: etl-log-viewer
    restart: always
    environment:
      - DOZZLE_LEVEL=info
    # Correctly feeding the exact CLI arguments v6.4.2 expects
    command: --username admin --password ${DOZZLE_PASSWORD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8888:8080"

networks:
  default:
    name: dozzle-logging-network